<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PANAS Questionnaire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0px;
            overflow-x: hidden;
            
        }

        .panas-container {
            width: 95%;
            max-width: 1000px;
            background-color: #ffffff;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 3px 7px rgba(0,0,0,0.1);
            box-sizing: border-box;
            overflow: hidden;
        }

        h3 {
            text-align: center;
            font-size: 20px;
            margin: 16px 0;
        }

        .panas-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #eee;
        }

        .emotion-label {
            width: 150px;
            font-weight: bold;
            font-size: 15px;
            text-align: left;
        }

        .panas-options {
            display: flex;
            justify-content: space-between;
            flex: 1;
        }

        .panas-options label {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 13px;
            flex: 1;
            padding: 4px;
            cursor: pointer;
        }

        .panas-options label span {
            margin-top: 8px;
        }

        input[type="radio"] {
            transform: scale(1.3);
            cursor: pointer;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="panas-container">
        <h3>How do you feel at present?</h3>

        <form action="{{ url_for('submit_panas') }}" method="POST">
            {% for item in panas_items %}
            <div class="panas-item-row">
                <div class="emotion-label">{{ item }}</div>
                <div class="panas-options">
                    {% for label, value in [
                        ('Very Slightly/Not At All', 1),
                        ('A Little', 2),
                        ('Moderately', 3),
                        ('Quite A Bit', 4),
                        ('Extremely', 5)
                    ] %}
                    <label>
                        <input type="radio" name="{{ item }}" value="{{ value }}" required>
                        <span>{{ label }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
